<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // Assignment 1: Create an Array
      // Create an array named colors with elements 'red', 'green', 'blue'
      let colors = ["red", "green", "blue"];
      console.log("Initial array:", colors);

      // Assignment 2: Access and Modify Array Elements
      // Access the second element (index 1) and change it to 'pink'
      colors[1] = "pink";
      console.log("After modifying second element:", colors);

      // Assignment 3: Determine the Length of an Array
      // Determine the length of the array and store it in a variable
      let lengthOfColors = colors.length;
      console.log("Length of colors array:", lengthOfColors);

      // Assignment 4: Use .pop() Method
      // Remove the last element using .pop() and display the modified array
      colors.pop();
      console.log("After using pop():", colors);
    </script>
  </body>
</html>
